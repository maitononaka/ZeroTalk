<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f8fafd" />
  <meta name="description" content="匿名でもGoogleでも始められる、URL招待型のシンプルな1対1チャット。" />
  <title>ZeroChat — private chat</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='20' fill='%231a73e8'/%3E%3Cpath d='M17 32c0-9 7-16 16-16s16 7 16 16-7 16-16 16H17l5-7c-3-3-5-6-5-9Z' fill='white'/%3E%3C/svg%3E" />
  <script src="./config.js"></script>
  <style>
    :root{
      --bg:#f7f9fc;--surface:#fff;--surface-2:#f1f3f7;--text:#202124;--muted:#6b7280;--line:#e3e7ee;--blue:#1a73e8;--blue-soft:#e8f0fe;--danger:#b3261e;--radius:22px;
    }
    *{box-sizing:border-box}html,body{height:100%;margin:0}body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(circle at top left,#eef5ff 0,#f7f9fc 34%,#f7f9fc 100%);color:var(--text)}button,input,textarea,select{font:inherit}button{border:0;cursor:pointer}.hidden{display:none!important}
    .shell{height:100dvh;display:grid;grid-template-columns:320px 1fr;gap:16px;padding:16px;max-width:1440px;margin:0 auto}
    .panel{background:rgba(255,255,255,.88);backdrop-filter:blur(18px);border:1px solid rgba(227,231,238,.9);box-shadow:0 16px 50px rgba(29,52,83,.08);border-radius:28px;overflow:hidden}
    .sidebar{display:flex;flex-direction:column;min-width:0}.brand{display:flex;align-items:center;gap:11px;padding:20px 20px 12px}.logo{width:42px;height:42px;border-radius:14px;background:var(--blue);display:grid;place-items:center;color:#fff;font-weight:800;font-size:20px;box-shadow:0 7px 18px rgba(26,115,232,.26)}.brand strong{font-size:19px}.brand small{display:block;color:var(--muted);font-size:12px;margin-top:2px}.profile-card{margin:10px 16px 14px;padding:12px 14px;border:1px solid var(--line);background:#fff;border-radius:18px;display:flex;align-items:center;gap:10px}.avatar{width:34px;height:34px;border-radius:50%;object-fit:cover;background:#dfe6f1;display:grid;place-items:center;color:#355;font-weight:700;flex:0 0 auto}.profile-meta{min-width:0;flex:1}.profile-meta strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}.profile-meta span{color:var(--muted);font-size:11px}.icon-btn{width:38px;height:38px;border-radius:12px;background:transparent;color:#5f6368}.icon-btn:hover{background:var(--surface-2)}.new-chat{margin:0 16px 14px;padding:12px 15px;border-radius:16px;background:var(--blue);color:#fff;font-weight:700;box-shadow:0 8px 18px rgba(26,115,232,.2)}.chat-list{padding:0 8px 12px;overflow:auto}.chat-row{display:flex;gap:12px;padding:11px 10px;border-radius:17px;align-items:center}.chat-row:hover,.chat-row.active{background:var(--blue-soft)}.chat-row .avatar{width:42px;height:42px}.chat-body{min-width:0;flex:1}.chat-body strong{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.chat-body p{margin:3px 0 0;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.empty-list{color:var(--muted);font-size:13px;text-align:center;padding:30px 20px}.sidebar-footer{margin-top:auto;padding:14px 16px;border-top:1px solid var(--line);display:flex;gap:8px}.ghost{background:var(--surface-2);color:#3c4043;padding:10px 12px;border-radius:13px}.ghost:hover{background:#e7ebf1}.workspace{display:flex;flex-direction:column;min-width:0}.topbar{display:flex;align-items:center;justify-content:space-between;padding:20px 22px;border-bottom:1px solid var(--line);gap:10px}.title-wrap{min-width:0}.title{font-size:18px;font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sub{font-size:12px;color:var(--muted);margin-top:2px}.messages{flex:1;overflow:auto;padding:28px clamp(18px,5vw,72px);display:flex;flex-direction:column;gap:10px}.bubble-row{display:flex}.bubble-row.mine{justify-content:flex-end}.bubble{max-width:min(78%,620px);padding:11px 14px;border-radius:18px;background:#f0f2f6;color:#24272b;line-height:1.55;font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere}.mine .bubble{background:var(--blue);color:#fff;border-bottom-right-radius:6px}.bubble-row:not(.mine) .bubble{border-bottom-left-radius:6px}.stamp{font-size:10px;color:var(--muted);margin:3px 5px 0}.mine .stamp{text-align:right}.composer{padding:14px 18px 18px;border-top:1px solid var(--line);display:flex;align-items:flex-end;gap:10px}.composer textarea{flex:1;resize:none;min-height:46px;max-height:140px;padding:12px 14px;border:1px solid var(--line);border-radius:16px;background:#f8fafc;outline:none}.composer textarea:focus{border-color:#93b8f3;box-shadow:0 0 0 4px #eaf2ff}.send{width:46px;height:46px;border-radius:15px;background:var(--blue);color:#fff;font-size:18px}.landing{height:100%;display:grid;place-items:center;padding:28px}.card{width:min(620px,100%);padding:34px;border-radius:28px;background:rgba(255,255,255,.92);border:1px solid var(--line);box-shadow:0 24px 70px rgba(29,52,83,.12)}.hero-logo{width:52px;height:52px;border-radius:17px;background:var(--blue);color:#fff;display:grid;place-items:center;font-size:24px;font-weight:800}.card h1{font-size:34px;line-height:1.1;margin:20px 0 10px}.card>p{color:var(--muted);line-height:1.7}.google{width:100%;padding:13px 14px;border:1px solid #dadce0;background:#fff;border-radius:15px;font-weight:650;color:#202124}.anon{width:100%;padding:13px 14px;background:#111827;color:#fff;border-radius:15px;font-weight:650}.or{display:flex;align-items:center;gap:10px;color:#9aa0a6;font-size:12px;margin:15px 0}.or:before,.or:after{content:"";height:1px;background:var(--line);flex:1}.linkbox{margin-top:18px;padding:14px;border:1px dashed #bfd0ea;border-radius:16px;background:#f7faff}.linkrow{display:flex;gap:9px}.linkrow input{min-width:0;flex:1;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff}.settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:flex;flex-direction:column;gap:6px}.field label{font-size:12px;color:var(--muted)}.field input,.field textarea,.field select{border:1px solid var(--line);background:#fff;border-radius:13px;padding:10px 12px;outline:none}.field textarea{min-height:92px;resize:vertical}.wide{grid-column:1/-1}.modal{position:fixed;inset:0;background:rgba(12,18,28,.28);display:grid;place-items:center;padding:20px;z-index:20}.modal-card{width:min(560px,100%);background:#fff;border-radius:24px;padding:22px;box-shadow:0 28px 90px rgba(0,0,0,.18)}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.modal-head strong{font-size:18px}.toast{position:fixed;right:20px;bottom:20px;background:#202124;color:#fff;padding:11px 14px;border-radius:12px;font-size:13px;z-index:50;box-shadow:0 10px 28px rgba(0,0,0,.18)}
    @media(max-width:900px){.shell{grid-template-columns:1fr;padding:0}.sidebar{display:none}.panel{border-radius:0}.workspace{min-height:100dvh}.topbar{padding-top:max(16px,env(safe-area-inset-top))}.messages{padding-left:14px;padding-right:14px}.bubble{max-width:88%}.landing{padding:18px}.card{padding:24px}.settings-grid{grid-template-columns:1fr}.wide{grid-column:auto}}
  </style>
</head>
<body>
  <div id="root"></div>
  <div id="toast" class="toast hidden"></div>
  <script>
  (() => {
    const cfg = window.APP_CONFIG || {};
    const API = (cfg.API_BASE || '').replace(/\/$/, '');
    const state = { user:null, chats:[], activeChat:null, lastMessageId:0, poll:null };
    const $ = s => document.querySelector(s);
    const esc = s => String(s ?? '');
    const fmt = ts => new Date(Number(ts)*1000).toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'});
    const deviceKey='zerochat_device_id'; const sessionKey='zerochat_session';
    function deviceId(){ let x=localStorage.getItem(deviceKey); if(!x){x=crypto.randomUUID();localStorage.setItem(deviceKey,x)} return x; }
    function token(){ return localStorage.getItem(sessionKey) || ''; }
    async function api(path, options={}){
      const headers=new Headers(options.headers||{}); if(options.body && !headers.has('content-type')) headers.set('content-type','application/json'); if(token()) headers.set('authorization','Bearer '+token());
      const r=await fetch(API+path,{...options,headers}); let data={}; try{data=await r.json()}catch{} if(!r.ok) throw new Error(data.error||`HTTP ${r.status}`); return data;
    }
    function toast(msg){const el=$('#toast');el.textContent=msg;el.classList.remove('hidden');clearTimeout(window.__toast);window.__toast=setTimeout(()=>el.classList.add('hidden'),2400)}
    function avatarMarkup(user, cls='avatar'){const name=esc(user?.display_name||'?');const img=esc(user?.avatar_url||'');return img?`<img class="${cls}" src="${img}" alt="" referrerpolicy="no-referrer">`:`<div class="${cls}">${name.slice(0,1)}</div>`}
    function layout(){ $('#root').innerHTML=`<div class="shell"><aside class="panel sidebar"><div class="brand"><div class="logo">Z</div><div><strong>ZeroChat</strong><small>private chat</small></div></div><div id="profileCard" class="profile-card"></div><button class="new-chat" id="newChatBtn">＋ 新しいチャット</button><div id="chatList" class="chat-list"></div><div class="sidebar-footer"><button class="ghost" id="shareBtn">招待リンク</button><button class="ghost" id="settingsBtn">設定</button></div></aside><main class="panel workspace"><div class="topbar"><div class="title-wrap"><div id="chatTitle" class="title">チャットを選択</div><div id="chatSub" class="sub">左側から会話を開くか、招待リンクを使います。</div></div><button class="icon-btn" id="deleteChatBtn" title="チャットを削除">🗑</button></div><div id="messages" class="messages"><div class="landing"><div class="card"><div class="hero-logo">Z</div><h1>つながるのは、URLだけ。</h1><p>匿名のままでも、Googleアカウントでも。自分の招待URLを共有して1対1で話せます。</p><button class="anon" id="shareMainBtn">自分の招待リンクを表示</button></div></div></div><form id="composer" class="composer"><textarea id="messageInput" rows="1" placeholder="メッセージを書く…" disabled></textarea><button class="send" type="submit" disabled>➤</button></form></main></div><div id="modal" class="modal hidden"></div>`; }
    async function boot(){
      if(!API || API.includes('YOUR-WORKER')){showSetup();return}
      layout();
      await processGoogleTicket();
      const me=await api('/api/me').catch(()=>({user:null}));
      if(!me.user){ const anon=await api('/api/session/anonymous',{method:'POST',body:JSON.stringify({device_id:deviceId()})}); localStorage.setItem(sessionKey,anon.session_token); state.user=anon.user; } else state.user=me.user;
      bind(); renderProfile(); await loadChats(); handleContactFromUrl();
    }
    function showSetup(){document.getElementById('root').innerHTML=`<div class="landing"><div class="card"><div class="hero-logo">Z</div><h1>ZeroChat</h1><p><b>docs/config.js</b> の <code>API_BASE</code> をCloudflare WorkerのURLに変更すると起動できます。</p></div></div>`}
    async function processGoogleTicket(){ const hash=new URLSearchParams(location.hash.slice(1)); const ticket=hash.get('auth'); if(!ticket)return; history.replaceState(null,'',location.pathname+location.search); try{const r=await api('/api/auth/google/exchange',{method:'POST',body:JSON.stringify({device_id:deviceId(),ticket})});localStorage.setItem(sessionKey,r.session_token);toast('Googleアカウントを連携しました。')}catch(e){toast('Googleログインを完了できませんでした')} }
    function bind(){
      $('#composer').addEventListener('submit',async e=>{e.preventDefault();const i=$('#messageInput');const body=i.value.trim();if(!body||!state.activeChat)return; i.value='';try{const r=await api(`/api/chats/${state.activeChat.id}/messages`,{method:'POST',body:JSON.stringify({body})}); appendMessages([r.message]); state.lastMessageId=r.message.id; loadChats();}catch(e){toast('送信できませんでした')}});
      $('#messageInput').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('#composer').requestSubmit()}});
      $('#newChatBtn').onclick=showNewChat; $('#shareBtn').onclick=showInvite; $('#shareMainBtn').onclick=showInvite; $('#settingsBtn').onclick=showSettings; $('#deleteChatBtn').onclick=deleteActive;
    }
    function renderProfile(){const u=state.user;$('#profileCard').innerHTML=`${avatarMarkup(u)}<div class="profile-meta"><strong>${esc(u.display_name||'匿名ユーザー')}</strong><span>${u.google_sub?'Google連携済み':'匿名セッション'}</span></div><button class="icon-btn" id="editProfile">✎</button>`;$('#editProfile').onclick=showSettings}
    async function loadChats(){const r=await api('/api/chats');state.chats=r.chats||[];$('#chatList').innerHTML=state.chats.length?state.chats.map(c=>`<div class="chat-row ${state.activeChat?.id===c.id?'active':''}" data-id="${c.id}">${avatarMarkup({display_name:c.other_name,avatar_url:c.other_avatar})}<div class="chat-body"><strong>${esc(c.other_name||'匿名ユーザー')}</strong><p>${esc(c.last_message||'まだメッセージはありません')}</p></div></div>`).join(''):'<div class="empty-list">まだチャットがありません。<br>招待リンクから会話を始めましょう。</div>';document.querySelectorAll('.chat-row').forEach(x=>x.onclick=()=>openChat(x.dataset.id));}
    async function openChat(id){state.activeChat=state.chats.find(c=>c.id===id)||null;if(!state.activeChat)return;state.lastMessageId=0;document.querySelectorAll('.chat-row').forEach(x=>x.classList.toggle('active',x.dataset.id===id));$('#chatTitle').textContent=state.activeChat.other_name||'匿名ユーザー';$('#chatSub').textContent=`保存期限 ${retentionLabel(state.activeChat.retention_seconds)}`;$('#messageInput').disabled=false;$('.send').disabled=false;$('#messages').innerHTML='';await fetchMessages(true);clearInterval(state.poll);state.poll=setInterval(()=>fetchMessages(false),3000)}
    async function fetchMessages(reset){if(!state.activeChat)return;try{const r=await api(`/api/chats/${state.activeChat.id}/messages?after=${state.lastMessageId}`);if(reset)$('#messages').innerHTML='';appendMessages(r.messages||[]);if(r.messages?.length)state.lastMessageId=r.messages[r.messages.length-1].id;}catch(e){}}
    function appendMessages(items){for(const m of items){if(document.querySelector(`[data-msg="${m.id}"]`))continue;const mine=m.sender_id===state.user.id;const row=document.createElement('div');row.className='bubble-row '+(mine?'mine':'');row.dataset.msg=m.id;row.innerHTML=`<div><div class="bubble"></div><div class="stamp">${fmt(m.created_at)}</div></div>`;row.querySelector('.bubble').textContent=m.body;$('#messages').appendChild(row);}$('#messages').scrollTop=$('#messages').scrollHeight}
    function retentionLabel(s){return s===3600?'1時間':s===604800?'7日':'24時間'}
    async function showNewChat(){const m=modal(` <div class="modal-card"><div class="modal-head"><strong>新しいチャット</strong><button class="icon-btn" data-close>✕</button></div><div class="field"><label>相手の招待URL / プロフィールID</label><input id="contact" placeholder="例: https://.../#to=AbCdEf12 または ID"><small style="color:var(--muted)">相手のURLに含まれるプロフィールIDを入力できます。</small></div><div class="field" style="margin-top:12px"><label>保存期限</label><select id="retention"><option value="3600">1時間</option><option value="86400" selected>24時間</option><option value="604800">7日</option></select></div><button class="anon" id="createChat" style="margin-top:16px">チャットを作成</button></div>`);m.querySelector('[data-close]').onclick=closeModal;m.querySelector('#createChat').onclick=async()=>{let raw=m.querySelector('#contact').value.trim();const mm=raw.match(/(?:^|[#?&])to=([^&#]+)/);if(mm)raw=mm[1];raw=raw.replace(/^https?:\/\/[^/]+\//,'').replace(/^#?to=/,'');try{const r=await api('/api/chats',{method:'POST',body:JSON.stringify({contact:raw,retention_seconds:Number(m.querySelector('#retention').value)})});closeModal();await loadChats();openChat(r.chat.id)}catch(e){toast(e.message==='CONTACT_NOT_FOUND'?'プロフィールが見つかりません':'チャットを作れませんでした')}}}
    function showInvite(){const u=location.origin+location.pathname+'#to='+encodeURIComponent(state.user.profile_slug);const modalEl = modal(`<div class="modal-card"><div class="modal-head"><strong>あなたの招待リンク</strong><button class="icon-btn" data-close>✕</button></div><p style="color:var(--muted)">このURLを相手に送ると、相手はあなたとの1対1チャットを開始できます。</p><div class="linkrow"><input id="invite" readonly value="${esc(u)}"><button class="anon" id="copy">コピー</button></div><div style="margin-top:14px;color:var(--muted);font-size:12px">表示名: ${esc(state.user.display_name||'匿名ユーザー')} / ID: ${esc(state.user.profile_slug)}</div></div>`);modalEl.querySelector('[data-close]').onclick=closeModal;modalEl.querySelector('#copy').onclick=()=>navigator.clipboard.writeText(u).then(()=>toast('コピーしました'))}
    function showSettings(){const u=state.user;const googleText=u.google_sub?'Google連携済み':'Googleアカウントを連携';const modalEl=modal(`<div class="modal-card"><div class="modal-head"><strong>設定</strong><button class="icon-btn" data-close>✕</button></div><div class="settings-grid"><div class="field wide"><label>表示名</label><input id="name" maxlength="60" value="${esc(u.display_name||'')}"></div><div class="field wide"><label>自己紹介</label><textarea id="bio" maxlength="160">${esc(u.bio||'')}</textarea></div></div><button class="anon" id="save" style="margin-top:15px">保存</button>${u.google_sub?'':'<button class="google" id="google" style="margin-top:10px">'+googleText+'</button>'}<div style="margin-top:12px;color:var(--muted);font-size:11px">プロフィールID: ${esc(u.profile_slug)}</div></div>`);modalEl.querySelector('[data-close]').onclick=closeModal;modalEl.querySelector('#save').onclick=async()=>{const r=await api('/api/profile',{method:'POST',body:JSON.stringify({display_name:modalEl.querySelector('#name').value,bio:modalEl.querySelector('#bio').value})});state.user=r.user;renderProfile();closeModal();toast('保存しました')};const g=modalEl.querySelector('#google');if(g)g.onclick=async()=>{try{const r=await api('/api/auth/google/start',{method:'POST',body:JSON.stringify({device_id:deviceId()})});location.href=r.url}catch(e){toast('Googleログインを開始できませんでした')}}}
    function modal(html){const el=$('#modal');el.innerHTML=html;el.classList.remove('hidden');return el}
    function closeModal(){ $('#modal').classList.add('hidden'); $('#modal').innerHTML='' }
    async function deleteActive(){if(!state.activeChat)return;if(!confirm('このチャットを双方から削除しますか？'))return;try{await api(`/api/chats/${state.activeChat.id}`,{method:'DELETE'});state.activeChat=null;clearInterval(state.poll);$('#messages').innerHTML='<div class="landing"><div class="card"><div class="hero-logo">Z</div><h1>チャットを選択</h1><p>新しい招待リンクを作るか、既存の会話を開いてください。</p></div></div>';$('#messageInput').disabled=true;$('.send').disabled=true;await loadChats()}catch(e){toast('削除できませんでした')}}
    function handleContactFromUrl(){const hash=new URLSearchParams(location.hash.slice(1));const to=hash.get('to');if(!to)return; history.replaceState(null,'',location.pathname+location.search);showNewChat();setTimeout(()=>{const i=$('#contact');if(i)i.value=to},50)}
    boot().catch(e=>{console.error(e);toast('起動に失敗しました')});
  })();
  </script>
</body>
</html>
